{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card p-8">
  <h1 class="font-display text-3xl font-bold">Welcome back</h1>
  <p class="mt-1 text-stone-600">Sign in as the adult who manages the family.</p>
  <form method="post" class="mt-6">
    {% include "core/_form.html" %}
    <button class="btn-primary w-full">Sign in</button>
  </form>
  <p class="mt-4 text-center text-sm text-stone-500">New here? <a class="font-bold text-brand-600" href="{% url 'core:signup' %}">Create a family account</a></p>
</div>
{% endblock %}
