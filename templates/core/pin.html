{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-sm card p-8 text-center">
  <div class="text-7xl">{{ learner.avatar }}</div>
  <h1 class="mt-3 font-display text-3xl font-bold">Hi {{ learner.name }}!</h1>
  <p class="text-stone-600">Type your secret code</p>
  <form method="post" class="mt-6">{% csrf_token %}{{ form.pin }}
    <button class="btn-primary mt-4 w-full">Go</button></form>
  <a href="{% url 'core:profiles' %}" class="mt-4 inline-block text-sm text-stone-500">Not {{ learner.name }}?</a>
</div>
{% endblock %}
