<div class="t-say" data-text="{{ text }}">
  <p class="t-say-text">{{ text }}</p>
  <div class="t-say-tools">
    <button type="button" class="t-round is-sm" data-act="play" title="Listen">🔈</button>
    <button type="button" class="t-round is-sm" data-act="save" title="Save">🔖</button>
    <button type="button" class="t-round is-sm" data-act="say" title="Say it">🎙️</button>
    <span class="t-say-score"></span>
  </div>
</div>
